name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms_dev_password
          POSTGRES_DB: pms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pms:pms_dev_password@localhost:5432/pms_test?schema=public
      TEST_DATABASE_URL: postgresql://pms:pms_dev_password@localhost:5432/pms_test?schema=public
      AUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
